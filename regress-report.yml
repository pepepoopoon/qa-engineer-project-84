bugreports:
  - summary: |
      При поиске несуществующего товара продолжают отображаться товары каталога
    environment: |
      Приложение: https://products-store-v2.hexlet.app/
      Браузер: Google Chrome
      ОС: macOS
    steps-to-reproduce: |
      1. Открыть главную страницу интернет-магазина
      2. Ввести xyznonexistent123 в поле поиска
      3. Проверить отображаемые результаты
    expected-result: |
      Товары не отображаются.
      Пользователь видит сообщение об отсутствии результатов поиска.
    actual-result: |
      После ввода несуществующего названия каталог
      продолжает отображать товары, не соответствующие запросу.
      Сообщение об отсутствии результатов не появляется.
      Скриншот: assets/search-nonexistent-product-bug.png
      Повторно подтверждено 27.10.2026 в Chromium.
      Дополнительный скриншот: assets/v2-search-nonexistent.jpg

  - summary: |
      При активном поиске или фильтре исчезает переход к другим страницам каталога
    environment: |
      Приложение: https://products-store-v2.hexlet.app/ (version 2)
      Браузер: Chromium
      ОС: macOS
      Дата проверки: 27.10.2026
    steps-to-reproduce: |
      1. Открыть каталог, оставить In Stock включённым, очистить остальные условия
      2. Нажать Next дважды и убедиться, что на третьей странице есть Plate
      3. Вернуться на первую страницу, ввести plate в поле поиска
      4. Проверить выдачу и доступность Next/Previous
      5. Очистить поиск, выбрать Chanel и проверить навигацию
      6. Добавить к Chanel диапазон цены 100–150 и проверить навигацию
      7. Снять Chanel, установить диапазон 10–50 и проверить навигацию
    expected-result: |
      Поиск и фильтры учитывают весь каталог.
      Plate находится независимо от исходной страницы.
      Если подходящая выдача занимает несколько страниц, доступна навигация по ней.
    actual-result: |
      При поиске plate на первой странице Plate отсутствует, показаны посторонние
      товары исходной страницы, а Next/Previous исчезают. Добраться до Plate нельзя.
      После выбора Chanel и Chanel + 100–150 остаётся Chanel Coco Noir Eau De,
      навигация также исчезает. То же наблюдается с диапазоном 10–50.
      В Version 1 при активном поиске пользователь мог листать исходные страницы.
      Это ухудшение существующего дефекта формирования выдачи, а не сброс фильтра.
      Скриншот: assets/v2-search-plate-no-pagination.jpg

  - summary: |
      В мобильном каталоге недоступны поиск и фильтры
    environment: |
      Приложение: https://products-store-v2.hexlet.app/ (version 2)
      Браузер: Google Chrome 155, Chrome DevTools
      ОС: macOS
      Устройство: эмуляция iPhone 16, viewport 393 x 852, не физический телефон
      Дата проверки: 27.10.2026
    steps-to-reproduce: |
      1. Открыть каталог в Chrome
      2. В DevTools включить эмуляцию iPhone 16 (393 x 852)
      3. Проверить доступность поиска, категории, бренда, In Stock и цены
      4. Найти доступную пользователю кнопку открытия этих элементов
    expected-result: |
      Поиск и фильтры доступны на мобильном экране напрямую
      либо через видимый элемент управления.
    actual-result: |
      Видны заголовок, навигация и карточки товаров.
      Поле поиска и фильтры скрыты; кнопки открытия фильтров нет.
      Пользователь не может выполнить поиск или задать условия фильтрации.
      В Version 1 фильтры присутствовали, хотя их вёрстка была неудобной.
      Скриншот: assets/v2-chrome-mobile-catalog.png
