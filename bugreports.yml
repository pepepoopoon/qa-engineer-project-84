---
- summary: |
    Фильтрация по цене учитывает первоначальную стоимость товара вместо цены со скидкой
  environment: |
    Приложение: https://products-store.hexlet.app/
    Браузер: Google Chrome
    ОС: macOS
  steps-to-reproduce: |
    1. Открыть каталог интернет-магазина
    2. Установить минимальную цену 10
    3. Установить максимальную цену 50
    4. Найти товар Dog Food
    5. Изменить минимальную цену на 11
  expected-result: |
    При фильтрации по актуальной цене продажи товары дешевле 10 долларов не должны отображаться
  actual-result: |
    При диапазоне 10–50 отображается товар Dog Food
    с первоначальной ценой 10,99 и ценой со скидкой 9,86.
    После изменения минимальной цены на 11 товар исчезает.
    Скриншот: assets/price-filter-bug.png

- summary: |
    Некорректный расчёт итоговой стоимости товаров в корзине
  environment: |
    Приложение: https://products-store.hexlet.app/
    Браузер: Google Chrome
    ОС: macOS
  steps-to-reproduce: |
    1. Открыть интернет-магазин
    2. Очистить корзину
    3. Добавить Essence Mascara Lash Princess за 8.94 $
    4. Добавить Eyeshadow Palette with Mirror за 16.35 $
    5. Открыть корзину
    6. Сравнить итоговую стоимость с суммой цен товаров
  expected-result: |
    Итоговая стоимость должна составлять 25.29 $
    (8.94 + 16.35)
  actual-result: |
    Итоговая стоимость составляет 25.30 $
    Сумма отличается на 0.01 $ в большую сторону.
    Аналогичное расхождение наблюдается при добавлении
    Powder Canister и Red Lipstick.
    Скриншот: assets/cart-total-bug.png

- summary: |
    Поиск и фильтры формируют результаты отдельно для исходных страниц каталога
  environment: |
    Приложение: https://products-store.hexlet.app/
    Браузер: Google Chrome
    ОС: macOS
  steps-to-reproduce: |
    1. Открыть каталог, очистить поле поиска и перейти на первую страницу
    2. Найти товар Plate на третьей странице каталога
    3. Вернуться на первую страницу и ввести plate в поиск
    4. Не удаляя поисковый запрос, перейти на третью страницу
    5. Сбросить поиск и выбрать доступный бренд, например Chanel
    6. Перейти на страницу, где товаров выбранного бренда нет
    7. Аналогично проверить списки категорий и фильтр In Stock при переходе между страницами
  expected-result: |
    Поиск и фильтры должны учитывать товары всего каталога до разделения
    результатов на страницы.
    Если подходящие товары существуют, пользователь должен находить их
    без перебора исходных страниц каталога.
    Списки доступных брендов и категорий не должны зависеть только от
    товаров исходной текущей страницы.
  actual-result: |
    При поиске plate на первой странице появляется Nothing found!,
    хотя на третьей странице тот же запрос находит товар Plate.
    Выбранный фильтр сохраняется при переключении страниц, однако
    подходящие товары отображаются только на тех исходных страницах,
    где они находятся. Промежуточные страницы могут показывать Nothing found!.
    Перечни доступных брендов и категорий меняются от страницы к странице.
    После фильтрации на разных страницах может оставаться различное
    количество подходящих товаров.
    Скриншоты:
    - assets/pagination-search-1.png
    - assets/pagination-search-2.png

- summary: |
    Выбранную категорию нельзя отменить без перезагрузки страницы
  environment: |
    Приложение: https://products-store.hexlet.app/
    Браузер: Google Chrome
    ОС: macOS
  steps-to-reproduce: |
    1. Открыть каталог товаров
    2. Открыть список категорий и выбрать beauty
    3. Повторно открыть список категорий
    4. Повторно нажать на beauty для отмены выбора
    5. Проверить, доступна ли другая возможность сбросить выбранную категорию
  expected-result: |
    Пользователь может отменить выбор категории через интерфейс
    без перезагрузки страницы, после чего снова отображается общий каталог.
  actual-result: |
    Повторное нажатие на beauty не отменяет выбранную категорию.
    Другого способа сброса категории в интерфейсе не обнаружено.
    Вернуться к общему каталогу удалось только после обновления
    страницы или повторного открытия сайта.

- summary: |
    Нажатие на хэштег товара не открывает соответствующую категорию
  environment: |
    Приложение: https://products-store.hexlet.app/
    Браузер: Google Chrome
    ОС: macOS
  steps-to-reproduce: |
    1. Открыть страницу товара Plate: https://products-store.hexlet.app/products/69
    2. Нажать на хэштег #kitchen-accessories над названием товара
  expected-result: |
    Открывается каталог с товарами категории kitchen-accessories.
  actual-result: |
    Страница товара Plate остаётся открытой.
    В адресной строке вместо /products/69 отображается /products/69#.
    Переход в каталог категории не происходит.
    Скриншот: assets/category-link-bug.png

- summary: |
    Магазин показывает успешный заказ при ответе сервера 500
  environment: |
    Приложение: https://products-store.hexlet.app/
    Браузер: Google Chrome
    ОС: macOS
  steps-to-reproduce: |
    1. Добавить один или несколько товаров в корзину
    2. Открыть корзину
    3. Открыть вкладки Network и Console в Chrome DevTools
    4. Нажать Checkout
    5. Посмотреть статус запроса POST /api/orders и сообщение на странице
  expected-result: |
    При серверной ошибке пользователь получает сообщение о невозможности
    подтвердить заказ, а не безусловное уведомление об успехе.
    Успешное оформление подтверждается только после успешной обработки запроса.
  actual-result: |
    Запрос POST /api/orders возвращает 500 Internal Server Error.
    При этом открывается окно Order placed successfully.
    Подтверждения того, что заказ сохранился на сервере, нет.
    Скриншот: assets/checkout-500-bug.png

- summary: |
    При оформлении заказа отсутствует предусмотренный этап оплаты
  environment: |
    Приложение: https://products-store.hexlet.app/
    Браузер: Google Chrome
    ОС: macOS
  steps-to-reproduce: |
    1. Добавить доступный товар в корзину
    2. Открыть корзину
    3. Нажать Checkout
    4. Проверить, есть ли этап оплаты или возможность перейти к нему
  expected-result: |
    Пользователь может пройти предусмотренный требованиями этап оплаты
    заказа, включая доступный в учебном приложении тестовый сценарий.
  actual-result: |
    Сразу появляется окно Order placed successfully со списком товаров
    и кнопкой закрытия.
    Платёжная форма или переход к оплате отсутствуют.
    Оплата не выполнялась.

- summary: |
    Интерфейс магазина некорректно отображается на мобильном экране
  environment: |
    Приложение: https://products-store.hexlet.app/
    Браузер: Google Chrome
    ОС: macOS
    Устройство: эмуляция iPhone 16 (393 x 852)
  steps-to-reproduce: |
    1. Открыть каталог интернет-магазина в Google Chrome
    2. В DevTools включить эмуляцию iPhone 16 с размером экрана 393 x 852
    3. Просмотреть фильтры, навигацию и карточки товаров
    4. Добавить два товара в корзину и открыть её
    5. Нажать Checkout и осмотреть окно подтверждения заказа
  expected-result: |
    Интерфейс подстраивается под ширину мобильного экрана.
    Фильтры, карточки, строки корзины и кнопки доступны без обрезания,
    наложения или выхода за границы экрана.
  actual-result: |
    Узкая колонка фильтров приводит к чрезмерному переносу названий брендов.
    Элементы каталога размещены неудобно; некоторые элементы пересекаются.
    В корзине часть значений и элементов строки выходит за ширину экрана.
    Окно подтверждения заказа обрезано справа, в том числе кнопка Close.
    Скриншоты:
    - assets/mobile-cart-bug.png
    - assets/mobile-checkout-bug.png

- summary: |
    Кликабельная область карточки товара выходит за пределы её рамки
  environment: |
    Приложение: https://products-store.hexlet.app/
    Браузер: Google Chrome
    ОС: macOS
  steps-to-reproduce: |
    1. Открыть каталог товаров
    2. В Chrome DevTools включить выбор HTML-элементов во вкладке Elements
    3. Выбрать ссылку карточки Essence Mascara Lash Princess
    4. Сравнить подсвеченную область ссылки с видимой рамкой карточки
    5. Нажать на участок за рамкой карточки, относящийся к области ссылки
  expected-result: |
    Нажатие за пределами видимой рамки карточки не открывает страницу товара.
    Кликабельная область соответствует визуальным границам карточки.
  actual-result: |
    Подсвеченная область ссылки выходит за пределы видимой рамки карточки.
    Нажатие за рамкой всё равно открывает страницу товара.
    Скриншот: assets/product-card-click-area.png

- summary: |
    В карточках каталога отсутствует предусмотренный требованиями рейтинг
  environment: |
    Приложение: https://products-store.hexlet.app/
    Браузер: Google Chrome
    ОС: macOS
  steps-to-reproduce: |
    1. Открыть первую страницу каталога
    2. Осмотреть карточку Essence Mascara Lash Princess
    3. Открыть страницу этого товара /products/1
    4. Сравнить наличие рейтинга в каталоге и на странице товара
  expected-result: |
    Рейтинг отображается в каталоге и на странице товара,
    как указано в requirements.yml и тест-кейсе об информации в каталоге.
  actual-result: |
    В каталоге отображаются название, описание, цены и остаток 99,
    но рейтинг отсутствует. На странице того же товара указан Rating: 2.56.
    Рейтинг также отсутствует в других карточках первой страницы.
    Скриншоты: 
    - assets/v1-catalog-rating-missing.png
    - assets/v1-product-rating.png

- summary: |
    Крестик в правом верхнем углу окна заказа не закрывает окно
  environment: |
    Приложение: https://products-store.hexlet.app/
    Браузер: Google Chrome
    ОС: macOS
  steps-to-reproduce: |
    1. Добавить Essence Mascara Lash Princess в корзину
    2. Открыть корзину и нажать Checkout
    3. Нажать крестик в правом верхнем углу Order placed successfully
  expected-result: |
    Нажатие кнопки закрытия убирает окно заказа.
  actual-result: |
    После нажатия крестика окно остаётся открытым.
    Нижняя кнопка Close закрывает окно.
    Скриншот: assets/v1-checkout-close-x.png

- summary: |
    После Clear cart удалённые товары возвращаются при обновлении страницы
  environment: |
    Приложение: https://products-store.hexlet.app/ 
    Браузер: Google Chrome
    ОС: macOS
  steps-to-reproduce: |
    1. Добавить Essence Mascara Lash Princess в пустую корзину
    2. Открыть корзину, убедиться в наличии товара и сумме 8.94 $
    3. Нажать Clear cart один раз
    4. Убедиться, что товар исчез, счётчик сброшен, сумма стала 0.00 $
    5. Обновить страницу браузера
  expected-result: |
    После полной очистки корзина остаётся пустой в текущей сессии,
    в том числе после обновления страницы. Сумма равна 0.00 $.
  actual-result: |
    Сразу после Clear cart корзина пуста и сумма равна 0.00 $.
    После обновления возвращается Mascara, счётчик 1 и сумма 8.94 $.
    Скриншот: assets/v1-clear-cart-after-reload.png
