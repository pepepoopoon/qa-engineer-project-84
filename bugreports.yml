---
- summary: |
    Фильтрация по цене учитывает первоначальную стоимость товара вместо цены со скидкой
  environment: |
    Приложение: https://products-store.hexlet.app/
    Браузер: Google Chrome
    ОС: macOS
  steps-to-reproduce: |
    1. Открыть каталог интернет-магазина
    2. Установить минимальную цену 10
    3. Установить максимальную цену 50
    4. Найти товар Dog Food
    5. Изменить минимальную цену на 11
  expected-result: |
    При фильтрации по актуальной цене продажи товары дешевле 10 долларов не должны отображаться
  actual-result: |
    При диапазоне 10–50 отображается товар Dog Food
    с первоначальной ценой 10,99 и ценой со скидкой 9,86.
    После изменения минимальной цены на 11 товар исчезает.
    Скриншот: assets/price-filter-bug.png

- summary: |
    Некорректный расчёт итоговой стоимости товаров в корзине
  environment: |
    Приложение: https://products-store.hexlet.app/
    Браузер: Google Chrome
    ОС: macOS
  steps-to-reproduce: |
    1. Открыть интернет-магазин
    2. Очистить корзину
    3. Добавить Essence Mascara Lash Princess за 8.94 $
    4. Добавить Eyeshadow Palette with Mirror за 16.35 $
    5. Открыть корзину
    6. Сравнить итоговую стоимость с суммой цен товаров
  expected-result: |
    Итоговая стоимость должна составлять 25.29 $
    (8.94 + 16.35)
  actual-result: |
    Итоговая стоимость составляет 25.30 $
    Сумма отличается на 0.01 $ в большую сторону.
    Аналогичное расхождение наблюдается при добавлении
    Powder Canister и Red Lipstick.
    Скриншот: assets/cart-total-bug.png
