---
- summary: |
    Успешный поиск товара по ключевому слову
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову
  prerequisites: |
    Открыта главная страница интернет-магазина
  test-data: |
    Поисковый запрос: lipstick
  steps:
    - Ввести lipstick в поле поиска
  expected-result: |
    Отображаются товары, соответствующие поисковому запросу

- summary: |
    Поиск несуществующего товара
  requirement: |
    Пользователь должен видеть сообщение при отсутствии результатов поиска
  prerequisites: |
    Открыта главная страница интернет-магазина
  test-data: |
    Поисковый запрос: xyznonexistent123
  steps:
    - Ввести xyznonexistent123 в поле поиска
  expected-result: |
    Отображается сообщение об отсутствии найденных товаров

- summary: |
    Фильтрация товаров по бренду
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    Открыт каталог товаров
  test-data: |
    Бренд: Chanel
  steps:
    - Выбрать бренд Chanel в списке фильтров
  expected-result: |
    Отображаются только товары выбранного бренда

- summary: |
    Фильтрация товаров по диапазону цен
  requirement: |
    Пользователь должен иметь возможность фильтровать товары по цене
  prerequisites: |
    Открыт каталог товаров
  test-data: |
    Минимальная цена: 10
    Максимальная цена: 50
  steps:
    - Установить минимальную цену 10
    - Установить максимальную цену 50
  expected-result: |
    Отображаются только товары стоимостью от 10 до 50 включительно

- summary: |
    Одновременная фильтрация по нескольким условиям
  requirement: |
    При выборе нескольких фильтров должны отображаться товары, соответствующие всем условиям
  prerequisites: |
    Открыт каталог товаров
  test-data: |
    Бренд: Chanel
    Наличие: In Stock
  steps:
    - Выбрать бренд Chanel
    - Включить фильтр In Stock
  expected-result: |
    Отображаются только товары бренда Chanel, имеющиеся в наличии

- summary: |
    Просмотр подробной информации о товаре
  requirement: |
    Пользователь должен иметь возможность просматривать подробную информацию о товаре
  prerequisites: |
    Открыт каталог с товарами
  test-data: |
    Любой доступный товар
  steps:
    - Открыть страницу выбранного товара
  expected-result: |
    Отображаются название, описание, рейтинг и цены товара со скидкой и без неё

- summary: |
    Успешное добавление товара в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину
  prerequisites: |
    Открыт каталог товаров
    Корзина пуста
  test-data: |
    Один товар из каталога, доступный для покупки
  steps:
    - Нажать Add to cart у выбранного товара
    - Открыть корзину
  expected-result: |
    Выбранный товар отображается в корзине

- summary: |
    Добавление нескольких разных товаров в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять несколько товаров в корзину
  prerequisites: |
    Открыт каталог товаров
    Корзина пуста
  test-data: |
    Два разных товара, доступных для покупки
  steps:
    - Добавить первый товар в корзину
    - Добавить второй товар в корзину
    - Открыть корзину
  expected-result: |
    В корзине отображаются оба выбранных товара

- summary: |
    Корректный расчёт общей стоимости корзины
  requirement: |
    Общая стоимость корзины должна рассчитываться с учётом скидок и количества товаров
  prerequisites: |
    Открыт каталог товаров
    Корзина пуста
  test-data: |
    Два разных товара с известными ценами
  steps:
    - Добавить первый товар в корзину
    - Добавить второй товар в корзину
    - Открыть корзину
    - Сравнить итоговую стоимость с суммой актуальных цен товаров
  expected-result: |
    Итоговая стоимость равна сумме цен добавленных товаров с учётом скидок

- summary: |
    Удаление товара из корзины
  requirement: |
    Пользователь должен иметь возможность удалять товары из корзины
  prerequisites: |
    В корзину добавлены два разных товара
  test-data: |
    Один из добавленных товаров
  steps:
    - Открыть корзину
    - Удалить выбранный товар
  expected-result: |
    Выбранный товар отсутствует в корзине
    Второй товар остаётся в корзине
    Общая стоимость пересчитывается

- summary: |
    Сохранение корзины при обновлении страницы
  requirement: |
    Содержимое корзины должно сохраняться в течение сессии браузера
  prerequisites: |
    Открыт интернет-магазин
    Корзина пуста
  test-data: |
    Один товар из каталога
  steps:
    - Добавить товар в корзину
    - Обновить страницу браузера
    - Открыть корзину
  expected-result: |
    Ранее добавленный товар остаётся в корзине

- summary: |
    Сохранение корзины при переключении языка
  requirement: |
    Переключение языка интерфейса не должно изменять содержимое корзины
  prerequisites: |
    Открыт интернет-магазин
    В корзину добавлен один товар
  test-data: |
    Язык интерфейса: русский
  steps:
    - Переключить язык интерфейса на русский
    - Открыть корзину
  expected-result: |
    Интерфейс отображается на русском языке
    Ранее добавленный товар остаётся в корзине

- summary: |
    Отображение информации о товарах в каталоге
  requirement: |
    В каталоге у каждого товара должны отображаться название, рейтинг, цена со скидкой и без скидки
  prerequisites: |
    Открыта главная страница интернет-магазина
  test-data: |
    Товары на первой странице каталога
  steps:
    - Просмотреть карточки товаров на первой странице каталога
  expected-result: |
    У каждого товара отображаются название, рейтинг, первоначальная цена и цена со скидкой

- summary: |
    Фильтрация товаров по категории
  requirement: |
    Пользователь должен иметь возможность фильтровать товары по категории
  prerequisites: |
    Открыт каталог товаров
  test-data: |
    Категория: beauty
  steps:
    - Открыть список категорий
    - Выбрать категорию beauty
  expected-result: |
    Отображаются только товары выбранной категории

- summary: |
    Фильтрация товаров по наличию
  requirement: |
    Пользователь должен иметь возможность фильтровать товары по наличию
  prerequisites: |
    Открыт каталог товаров
  test-data: |
    Фильтр In Stock
  steps:
    - Включить фильтр In Stock
    - Просмотреть товары в результатах фильтрации
  expected-result: |
    Отображаются только товары, имеющиеся в наличии

- summary: |
    Полная очистка корзины
  requirement: |
    Пользователь должен иметь возможность полностью очищать корзину
  prerequisites: |
    В корзину добавлены два разных товара
  test-data: |
    Два товара из каталога
  steps:
    - Открыть корзину
    - Нажать Clear cart
  expected-result: |
    Все товары удалены из корзины
    Корзина отображается пустой
    Общая стоимость равна нулю

- summary: |
    Навигация между страницами каталога
  requirement: |
    Пользователь должен иметь возможность просматривать товары на разных страницах каталога
  prerequisites: |
    Открыта первая страница каталога товаров
  test-data: |
    Кнопки Next и Previous
  steps:
    - Нажать Next
    - Запомнить товары на открывшейся странице
    - Нажать Previous
  expected-result: |
    После нажатия Next отображается следующая страница товаров
    После нажатия Previous отображается предыдущая страница каталога

- summary: |
    Переход в категорию по хэштегу товара
  requirement: |
    Пользователь должен иметь возможность переходить в категорию товара по хэштегу
  prerequisites: |
    Открыта страница товара, содержащего хэштег категории
  test-data: |
    Хэштег категории выбранного товара
  steps:
    - Нажать на хэштег категории на странице товара
  expected-result: |
    Открывается каталог с товарами соответствующей категории

- summary: |
    Переход к оформлению заказа
  requirement: |
    Пользователь должен иметь возможность оформить заказ с переходом на страницу оплаты
  prerequisites: |
    В корзину добавлен товар, доступный для покупки
  test-data: |
    Один товар из каталога
  steps:
    - Открыть корзину
    - Нажать Checkout
  expected-result: |
    Открывается страница или форма оформления заказа с возможностью перехода к оплате

- summary: |
    Закрытие окна оформления заказа
  requirement: |
    Пользователь должен иметь возможность закрыть окно оформления заказа
  prerequisites: |
    Открыто окно оформления заказа
  test-data: |
    Не требуются
  steps:
    - Нажать кнопку закрытия окна оформления заказа
  expected-result: |
    Окно оформления заказа закрывается

- summary: |
    Переключение языка интерфейса
  requirement: |
    Сайт должен поддерживать русский и английский языки
  prerequisites: |
    Открыт интернет-магазин на английском языке
  test-data: |
    Языки: русский и английский
  steps:
    - Переключить язык интерфейса на русский
    - Проверить текст элементов интерфейса
    - Переключить язык интерфейса на английский
  expected-result: |
    После каждого переключения основные элементы интерфейса отображаются на выбранном языке

- summary: |
    Проверка загрузки ресурсов и сетевых запросов
  requirement: |
    Ресурсы сайта должны загружаться без ошибок
  prerequisites: |
    Открыт интернет-магазин в Google Chrome
    Открыты Chrome DevTools
  test-data: |
    Вкладки Network и Console
  steps:
    - Открыть вкладку Network
    - Обновить страницу интернет-магазина
    - Выполнить поиск товара
    - Проверить статусы сетевых запросов
    - Открыть вкладку Console
  expected-result: |
    Ресурсы и необходимые данные загружаются без ошибок
    Отсутствуют неуспешные запросы, влияющие на работу проверяемых функций
    В Console отсутствуют ошибки выполнения скриптов

- summary: |
    Проверка работы интернет-магазина в Safari
  requirement: |
    Сайт должен быть совместим с актуальными версиями браузеров
  prerequisites: |
    Установлен браузер Safari
  test-data: |
    Браузер Safari
  steps:
    - Открыть интернет-магазин в Safari
    - Выполнить поиск товара по ключевому слову
    - Добавить товар в корзину
    - Открыть корзину
  expected-result: |
    Страницы отображаются корректно
    Поиск и добавление товара в корзину работают
    Отсутствуют ошибки, препятствующие выполнению проверяемых действий

- summary: |
    Проверка отображения интернет-магазина на мобильном устройстве
  requirement: |
    Сайт должен иметь мобильную версию и корректно отображаться на разных устройствах
  prerequisites: |
    Открыт интернет-магазин в Google Chrome
    Открыты Chrome DevTools
  test-data: |
    Эмуляция iPhone 16 в Chrome DevTools
  steps:
    - Включить режим эмуляции мобильного устройства
    - Выбрать iPhone 16
    - Открыть каталог товаров
    - Просмотреть карточки товаров и фильтры
    - Открыть корзину
  expected-result: |
    Основные элементы интерфейса отображаются без наложений и обрезания
    Каталог, фильтры и корзина доступны для использования

- summary: |
    Проверка кликабельной области карточки товара
  requirement: |
    Пользователь должен иметь возможность открывать подробную информацию о товаре
  prerequisites: |
    Открыт каталог товаров
  test-data: |
    Любая карточка товара
  steps:
    - Открыть Chrome DevTools
    - Проверить границы элементов карточки товара во вкладке Elements
    - Нажать на название товара
    - Вернуться в каталог
    - Нажать на изображение товара
  expected-result: |
    Кликабельные области соответствуют визуальному расположению элементов
    Нажатие на название и изображение товара открывает страницу выбранного товара
