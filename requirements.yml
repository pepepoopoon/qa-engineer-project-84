---
functional:
  - Пользователь должен иметь возможность искать товары по ключевому слову или категории
  - Пользователь должен иметь возможность фильтровать товары
  - Пользователь должен иметь возможность просматривать товары и просматривать подробную информацию о товаре
  - Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины
  - Пользователь должен иметь возможность переключить язык интерфейса
  - Пользователь должен иметь возможность ужадять товары из корзины
  - Пользователь должен иметь возможность продолжать выбор товаров после перехода в корзину
  - Пользователь должен иметь возможность оформить заказ с переходом на страницу оплаты
  - В каталоге и на странице товара должны отображаться название, рейтинг, цена со скидкой и без скидки
  - Содержимое корзины должно сохраняться в течение сессии браузера
non-functional:
  - Сайт нужно разработать с учетом удобства использования и оптимизировать для скорости работы
  - Сайт должен быть безопасным и защищать данные пользователя
  - Сайт должен иметь мобильную версию
  - Сайт нужно протестировать на совместимость с последними версиями браузеров
  - Важно, чтобы сайт мог обрабатывать большое количество трафика
  - Сайт должен быть доступен на различных устройствах
  - Сайт должен иметь локализацию (перевод) на русский и английский языки
  - Сайт должен быть доступен для пользователей без использования VPN (прямой доступ из сети Интернет)
  - Сайт должен работать как SPA без полной перезагрузки страницы
implicit:
  - При поиске товаров должны отображаться результаты, соответствующие поисковому запросу
  - При выборе нескольких фильтров должны отображаться только товары, соответствующие всем выбранным условиям
  - Если товары не найдены, пользователь должен видеть сообщение об отсутствии результатов
  - Пользователь должен видеть актуальную информацию о наличии товара
  - После добавления товара в корзину он должен отображаться в её содержимом
  - Общая стоимость корзины должна правильно рассчитываться с учетом скидок и количества товаров
  - После удаления товара из корзины общая стоимость должна пересчитываться
  - При переключении языка содержимое корзины не должно изменяться
  - Если корзина пуста, пользователь должен видеть соответствующее сообщение
